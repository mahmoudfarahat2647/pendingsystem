# [CRITICAL] PROTECTED WORKFLOW - BACKUP & REPORTS
# This workflow runs the `scripts/generate-backup.mjs` in a clean environment.
# Ensure all secrets (SUPABASE_URL, SMTP_PASS, etc.) are configured in Repo Settings.
name: Backup & Reports

on:
  schedule:
    # Runs daily at 08:00 UTC (10:00 Cairo winter / 11:00 Cairo summer)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the UI or GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: backup-reports
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IS_SCHEDULE_RUN: ${{ github.event_name == 'schedule' }}
        run: node scripts/generate-backup.mjs
